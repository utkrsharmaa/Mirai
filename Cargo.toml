[package]
name = "mirai"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.7.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.3.1"
gtk = { version = "0.9.6", package = "gtk4", features = ["v4_18"] }
reqwest = {version ="0.12.20", features=["json"]}
serde = {version = "1.0.219", features=["derive"]}
thiserror = "2.0.12"
serde_json = "1.0.140"
